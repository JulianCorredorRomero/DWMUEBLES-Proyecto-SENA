<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">MDWSOFT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Portafolio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
            </ul>
        </div>
    </div>

    <h1 class="text-center pt-5">Login Page</h1>">
    <h2 class="text-center pb-2">MDWSOFT</h2>
    </header>
    <main class="text-center">
        <form onsubmit="loginUser(event)">
            <label class="mx-3"for="username">Usuario:</label>
            <input type="text" id="username" name="username" required><br><br>
            <label class="mx-1"for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>
            <input type="hidden" id="role" name="role">
        <div id="roleDisplay" class="mb-3">
            Selected Role: None
        </div>
        <div>
                  <button type="button" class="btn btn-warning btn-sm" onclick="setRole('Cliente', event)">Cliente</button>
                  <button type="button" class="btn btn-sm" onclick="setRole('Carpintero', event)">Carpintero</button>
                  <button type="button" class="btn btn-sm" onclick="setRole('Administrador', event)">Administrador</button>
        </div>
        <div class="mb-3 mt-3">
            <label for="rememberMe">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                Remember Me
            </label>
        </div>
        <button type="submit" class="btn btn-warning btn-md">Ingresar</button>
        </form>
    </main>
    <footer class="text-center py-2 mt-4">

<script src="/src/JS/login.js"></script>
</body>
</html>
