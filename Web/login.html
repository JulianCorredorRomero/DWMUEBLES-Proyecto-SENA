<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <h1>Login Page</h1>
    <h2>MDWSOFT</h2>
    </header>
    <main>
         <form action="/login" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br> 
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br> 
        <input type="hidden" name="role" id="role">
        <button type="button" onclick="setRole('cliente')">Cliente</button>
        <button type="button" onclick="setRole('carpintero')">Carpintero</button>
        <button type="button" onclick="setRole('administrador')">Administrador</button>
        <button type="submit">Ingresar</button>
    </main>
    <footer>
    <p>&copy; 2025 MDWSOFT. All rights reserved.</p>
    </footer>
</body>
</html>
